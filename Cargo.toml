[package]
name = "devin-tokenviz"
version = "0.1.0"
edition = "2024"
description = "TUI visualization of Devin CLI token usage and cost"
license = "MIT"
repository = "https://github.com/lexoliu/devin-tokenviz"

[dependencies]
anyhow = "1"
bincode = "1.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
terminal_size = "0.4"
toml = "0.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
