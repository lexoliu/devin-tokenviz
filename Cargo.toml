[package]
name = "devin-tokenviz"
version = "0.1.0"
edition = "2024"
description = "TUI visualization of Devin CLI token usage and cost"
license = "MIT"
repository = "https://github.com/lexoliu/devin-tokenviz"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
unicode-width = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
